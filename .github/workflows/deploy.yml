name: Build, Push, and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy-to-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Install Wrangler
        working-directory: api-router
        run: npm ci

      - name: Deploy to Cloudflare
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  build-and-deploy-to-modal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for segmentation worker changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: main
          filters: |
            segmentation-changed:
              - 'backend/segmentation-worker/**'

      - name: Set up Python
        if: steps.filter.outputs.segmentation-changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        if: steps.filter.outputs.segmentation-changed == 'true'
        run: python -m pip install --upgrade modal

      - name: Deploy segmentation worker
        if: steps.filter.outputs.segmentation-changed == 'true'
        working-directory: backend/segmentation-worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_worker.py