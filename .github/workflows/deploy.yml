name: Build, Push, and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required if pushing to GitHub Container Registry (GHCR)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Authenticate to Google Cloud
      #- name: Authenticate to Google Cloud
      #  uses: google-github-actions/auth@v2
      #  with:
      #    credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Build & Push Backend Core
      - name: Build and Push Backend Core
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/backend-core:latest \
            ./backend/core
          docker push ghcr.io/${{ github.repository }}/backend-core:latest

      # 4. Build & Push Segmentation Worker
      - name: Build and Push Segmentation Worker
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/segmentation-worker:latest ./backend/segmentation-worker
          docker push ghcr.io/${{ github.repository }}/segmentation-worker:latest

