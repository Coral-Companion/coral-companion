name: Preview lifecycle
description: Reusable workflow to create, redeploy, or teardown a preview environment

on:
  workflow_call:
    inputs:
      action:
        description: "create | redeploy | teardown"
        type: string
        required: true
      branch:
        description: "Git branch to preview"
        type: string
        required: true
      slug:
        description: "URL-safe preview slug (defaults to branch-based slug)"
        type: string
        required: false

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true
      MODAL_KEY:
        required: true
      MODAL_SECRET:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      DATABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Determine preview name and slug
        id: slug
        run: |
          BRANCH="${{ inputs.branch }}"
          # Strip refs/heads/ prefix (comes from the `delete` event)
          BRANCH="${BRANCH#refs/heads/}"
          SLUG="${{ inputs.slug }}"
          if [ -z "$SLUG" ]; then
            SLUG=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          fi
          PREVIEW_NAME="preview-${SLUG}"
          echo "preview_name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Install Modal
        run: pip install --upgrade modal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        working-directory: api-router
        run: npm ci

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade awscli

      # ---- Modal environment ----
      - name: Create Modal environment
        if: inputs.action == 'create'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal environment create "${{ steps.slug.outputs.preview_name }}" || true

      - name: Download CoralSCOP checkpoint from R2
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: backend/segmentation-worker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          CHECKPOINT="third_party/coralscop/checkpoints/vit_b_coralscop.pth"
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          mkdir -p "$(dirname "$CHECKPOINT")"

          aws s3 cp \
            s3://coral-companion-models/coralscop/vit_b_coralscop-v1.pth \
            "$CHECKPOINT" \
            --endpoint-url "$R2_ENDPOINT"

          test -s "$CHECKPOINT"
          echo "Checkpoint downloaded successfully."
          ls -lh "$CHECKPOINT"

      - name: Deploy segmentation worker to Modal
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        id: modal-deploy
        working-directory: backend/segmentation-worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ steps.slug.outputs.preview_name }}
        run: |
          MODAL_OUTPUT=$(modal deploy modal_worker.py 2>&1)
          echo "$MODAL_OUTPUT"

      - name: Get segmentation worker URL
        id: modal-url
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: backend/segmentation-worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ steps.slug.outputs.preview_name }}
        run: |
          MODAL_JSON=$(modal function info coral-companion-segmentation-worker/serve --env "${{ steps.slug.outputs.preview_name }}" --json)
          SEGMENTATION_WORKER_URL=$(echo "$MODAL_JSON" | python -c "import sys,json; print(json.load(sys.stdin)['web_info']['web_url'])")
          if [ -z "$SEGMENTATION_WORKER_URL" ]; then
            echo "❌ Could not extract web_url from modal function info"
            exit 1
          fi
          echo "segmentation_worker_url=$SEGMENTATION_WORKER_URL" >> $GITHUB_OUTPUT

      # ---- Wrangler preview config ----
      - name: Generate preview wrangler config
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        id: wrangler-config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEGMENTATION_WORKER_URL: ${{ steps.modal-url.outputs.segmentation_worker_url }}
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          PREVIEW_NAME="${{ steps.slug.outputs.preview_name }}"
          BUCKET_NAME="coral-companion-media-preview-${SLUG}"
          DATABASE_URL="${DATABASE_URL}"
          SUPABASE_KEY="${SUPABASE_KEY}"
          SEGMENTATION_WORKER_URL="${SEGMENTATION_WORKER_URL}"

          cat > /tmp/wrangler.preview.${SLUG}.jsonc << EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "coral-companion-router-preview-${SLUG}",
            "main": "src/index.ts",
            "compatibility_date": "2025-06-23",
            "compatibility_flags": ["nodejs_compat"],
            "observability": { "enabled": true },
            "assets": {
              "directory": "../frontend/dist",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*"]
            },
            "containers": [
              {
                "class_name": "BackendCore",
                "image": "../backend/core/Dockerfile",
                "instance_type": { "vcpu": 1, "memory_mib": 3072, "disk_mb": 4000 },
                "max_instances": 3
              }
            ],
            "durable_objects": {
              "bindings": [{
                "class_name": "BackendCore",
                "name": "CORE_CONTAINER"
              }]
            },
            "exports": {
              "BackendCore": { "type": "durable-object", "storage": "sqlite" }
            },
            "vars": {
              "BUCKET_NAME": "${BUCKET_NAME}",
              "SEGMENTATION_PROVIDER": "coralscop",
              "R2_PUBLIC_BASE_URL": "https://${BUCKET_NAME}.r2.cloudflarestorage.com"
            },
            "secrets": {
              "required": [
                "SUPABASE_KEY",
                "DATABASE_URL",
                "SEGMENTATION_WORKER_URL",
                "MODAL_KEY",
                "MODAL_SECRET",
                "R2_ACCOUNT_ID",
                "R2_ACCESS_KEY_ID",
                "R2_SECRET_ACCESS_KEY"
              ]
            }
          }
          EOF
          echo "config_path=/tmp/wrangler.preview.${SLUG}.jsonc" >> $GITHUB_OUTPUT
          echo "worker_name=coral-companion-router-preview-${SLUG}" >> $GITHUB_OUTPUT

      # ---- R2 bucket ----
      - name: Create R2 preview bucket
        if: inputs.action == 'create'
        id: r2-bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET_NAME="coral-companion-media-preview-${{ steps.slug.outputs.slug }}"
          npx wrangler r2 bucket create "${BUCKET_NAME}" \
            --config /tmp/wrangler.preview.${SLUG}.jsonc
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload R2 seed objects
        if: inputs.action == 'create'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: ${{ steps.r2-bucket.outputs.bucket_name }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for file in $(find preview-data/r2-seed -type f | sort); do
            # Preserve directory structure relative to preview-data/r2-seed/
            KEY="${file#preview-data/r2-seed/}"
            aws s3 cp "$file" "s3://${BUCKET_NAME}/${KEY}" \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --access-key "$R2_ACCESS_KEY_ID" \
              --secret-key "$R2_SECRET_ACCESS_KEY" \
              --no-progress
          done

      - name: Set preview secrets via wrangler
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEGMENTATION_WORKER_URL: ${{ steps.modal-deploy.outputs.segmentation_worker_url }}
          MODAL_KEY: ${{ secrets.MODAL_KEY }}
          MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          CONFIG_PATH="${{ steps.wrangler-config.outputs.config_path }}"
          echo "$DATABASE_URL" | npx wrangler secret put --config "$CONFIG_PATH" DATABASE_URL
          echo "$SUPABASE_KEY" | npx wrangler secret put --config "$CONFIG_PATH" SUPABASE_KEY
          echo "$SEGMENTATION_WORKER_URL" | npx wrangler secret put --config "$CONFIG_PATH" SEGMENTATION_WORKER_URL
          echo "$MODAL_KEY" | npx wrangler secret put --config "$CONFIG_PATH" MODAL_KEY
          echo "$MODAL_SECRET" | npx wrangler secret put --config "$CONFIG_PATH" MODAL_SECRET
          echo "$R2_ACCOUNT_ID" | npx wrangler secret put --config "$CONFIG_PATH" R2_ACCOUNT_ID
          echo "$R2_ACCESS_KEY_ID" | npx wrangler secret put --config "$CONFIG_PATH" R2_ACCESS_KEY_ID
          echo "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put --config "$CONFIG_PATH" R2_SECRET_ACCESS_KEY

      - name: Build frontend
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy preview router to Cloudflare
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CONFIG_PATH="${{ steps.wrangler-config.outputs.config_path }}"
          npx wrangler deploy --config "$CONFIG_PATH"
          echo "✅ Preview deployed successfully"

      - name: Output preview URL
        if: inputs.action == 'create'
        run: |
          WORKER_NAME="${{ steps.wrangler-config.outputs.worker_name }}"
          echo "🎉 Preview environment ready!"
          echo "Preview URL: https://${WORKER_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "preview_url=https://${WORKER_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_OUTPUT

      # ---- Teardown ----
      - name: Empty and delete R2 preview bucket
        if: inputs.action == 'teardown'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKET_NAME="coral-companion-preview-${{ steps.slug.outputs.slug }}"
          OBJECTS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}/objects?limit=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | grep -oE '"key":"[^"]+"' | cut -d'"' -f4)
          if [ -n "$OBJECTS" ]; then
            for KEY in $OBJECTS; do
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}/objects/${KEY}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /dev/null
            done
          fi
          curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo "✅ R2 bucket deleted"

      - name: Delete preview worker from Cloudflare
        if: inputs.action == 'teardown'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          WORKER_NAME="coral-companion-router-preview-${{ steps.slug.outputs.slug }}"
          curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo "✅ Preview worker deleted"

      - name: Delete Modal environment
        if: inputs.action == 'teardown'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        continue-on-error: true
        run: |
          modal environment delete "${{ steps.slug.outputs.preview_name }}" --yes || true
          echo "✅ Modal environment deleted"