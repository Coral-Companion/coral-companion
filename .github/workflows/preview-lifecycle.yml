name: Preview lifecycle
description: Reusable workflow to create, redeploy, or teardown a preview environment

on:
  workflow_call:
    inputs:
      action:
        description: "create | redeploy | teardown"
        type: string
        required: true
      branch:
        description: "Git branch to preview"
        type: string
        required: true
      slug:
        description: "Preview slug (without 'preview' prefix)"
        type: string
        required: false

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true
      MODAL_KEY:
        required: true
      MODAL_SECRET:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      DATABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Determine preview name and slug
        id: slug
        run: |
          BRANCH="${{ inputs.branch }}"
          # Strip refs/heads/ prefix (comes from the `delete` event)
          BRANCH="${BRANCH#refs/heads/}"
          SLUG="${{ inputs.slug }}"
          if [ -z "$SLUG" ]; then
            SLUG=$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          fi
          PREVIEW_NAME="preview-${SLUG}"
          echo "preview_name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Install Modal
        run: pip install --upgrade modal

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'

      - name: Install wrangler
        working-directory: api-router
        run: npm ci

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade awscli

      # ---- Modal environment ----
      - name: Create Modal environment
        if: inputs.action == 'create'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal environment create "${{ steps.slug.outputs.preview_name }}" || true

      - name: Download CoralSCOP checkpoint from R2
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: backend/segmentation-worker
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          CHECKPOINT="third_party/coralscop/checkpoints/vit_b_coralscop.pth"
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          mkdir -p "$(dirname "$CHECKPOINT")"

          aws s3 cp \
            s3://coral-companion-models/coralscop/vit_b_coralscop-v1.pth \
            "$CHECKPOINT" \
            --endpoint-url "$R2_ENDPOINT"

          test -s "$CHECKPOINT"
          echo "Checkpoint downloaded successfully."
          ls -lh "$CHECKPOINT"

      - name: Deploy segmentation worker to Modal
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        id: modal-deploy
        working-directory: backend/segmentation-worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ steps.slug.outputs.preview_name }}
        run: |
          MODAL_OUTPUT=$(modal deploy modal_worker.py 2>&1) || true
          echo "$MODAL_OUTPUT"

      - name: Get segmentation worker URL
        id: modal-url
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: backend/segmentation-worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ steps.slug.outputs.preview_name }}
        run: |
          MODAL_JSON=$(modal function info coral-companion-segmentation-worker/serve --env "${{ steps.slug.outputs.preview_name }}" --json)
          SEGMENTATION_WORKER_URL=$(echo "$MODAL_JSON" | python -c "import sys,json; print(json.load(sys.stdin)['web_info']['web_url'])")
          if [ -z "$SEGMENTATION_WORKER_URL" ]; then
            echo "❌ Could not extract web_url from modal function info"
            exit 1
          fi
          echo "segmentation_worker_url=$SEGMENTATION_WORKER_URL" >> $GITHUB_OUTPUT

          # ---- R2 bucket ----
      - name: Determine R2 preview bucket name
        id: r2-bucket-name
        run: |
          BUCKET_NAME="media-preview-${{ steps.slug.outputs.slug }}"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Create R2 preview bucket
        if: inputs.action == 'create'
        id: r2-bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: ${{ steps.r2-bucket-name.outputs.bucket_name }}
        run: |
          npx wrangler r2 bucket create "${BUCKET_NAME}"

      - name: Upload R2 seed objects
        if: inputs.action == 'create'
        working-directory: backend/core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: ${{ steps.r2-bucket-name.outputs.bucket_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Use null-delimited find/sort so directory/file names with spaces are safe
          while IFS= read -r -d '' file; do
            # Preserve directory structure relative to preview-data/r2-seed/
            KEY="${file#preview-data/r2-seed/}"
            aws s3 cp "$file" "s3://${BUCKET_NAME}/${KEY}" \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --no-progress
          done < <(find preview-data/r2-seed -type f -print0 | sort -z)

      - name: Build frontend
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: frontend
        run: |
          npm ci
          npm run build-for-preview-environment

      - name: Deploy preview router to Cloudflare
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler preview --config wrangler.jsonc \
          --name ${{ steps.slug.outputs.preview_name }} \
          --var R2_PUBLIC_BASE_URL:https://${{ steps.r2-bucket-name.outputs.bucket_name }}.r2.cloudflarestorage.com
          echo "✅ Preview deployed successfully"

      - name: Set preview secrets via wrangler
        if: inputs.action == 'create' || inputs.action == 'redeploy'
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEGMENTATION_WORKER_URL: ${{ steps.modal-url.outputs.segmentation_worker_url }}
          MODAL_KEY: ${{ secrets.MODAL_KEY }}
          MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ steps.r2-bucket-name.outputs.bucket_name }}
          R2_PUBLIC_BASE_URL: https://${{ steps.r2-bucket-name.outputs.bucket_name }}.r2.cloudflarestorage.com
        run: |
          echo "$DATABASE_URL" | npx wrangler preview secret put DATABASE_URL --name ${{ steps.slug.outputs.preview_name }}
          echo "$SUPABASE_KEY" | npx wrangler preview secret put SUPABASE_KEY --name ${{ steps.slug.outputs.preview_name }}
          echo "$SEGMENTATION_WORKER_URL" | npx wrangler preview secret put SEGMENTATION_WORKER_URL --name ${{ steps.slug.outputs.preview_name }}
          echo "$MODAL_KEY" | npx wrangler preview secret put MODAL_KEY --name ${{ steps.slug.outputs.preview_name }}
          echo "$MODAL_SECRET" | npx wrangler preview secret put MODAL_SECRET --name ${{ steps.slug.outputs.preview_name }}
          echo "$R2_ACCOUNT_ID" | npx wrangler preview secret put R2_ACCOUNT_ID --name ${{ steps.slug.outputs.preview_name }}
          echo "$R2_ACCESS_KEY_ID" | npx wrangler preview secret put R2_ACCESS_KEY_ID --name ${{ steps.slug.outputs.preview_name }}
          echo "$R2_SECRET_ACCESS_KEY" | npx wrangler preview secret put R2_SECRET_ACCESS_KEY --name ${{ steps.slug.outputs.preview_name }}
          echo "$BUCKET_NAME" | npx wrangler preview secret put BUCKET_NAME --name ${{ steps.slug.outputs.preview_name }}
          echo "$R2_PUBLIC_BASE_URL" | npx wrangler preview secret put R2_PUBLIC_BASE_URL --name ${{ steps.slug.outputs.preview_name }}

      - name: Output preview URL
        if: inputs.action == 'create'
        run: |
          WORKER_NAME="coral-companion-router-preview-${{ steps.slug.outputs.slug }}"
          echo "🎉 Preview environment ready!"
          echo "Preview URL: https://${WORKER_NAME}.{$R2_ACCOUNT_ID}.workers.dev"
          echo "preview_url=https://${WORKER_NAME}.{$R2_ACCOUNT_ID}.workers.dev" >> $GITHUB_OUTPUT

      # ---- Teardown ----
      - name: Empty and delete R2 preview bucket
        if: inputs.action == 'teardown'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BUCKET_NAME=${{ steps.r2-bucket-name.outputs.bucket_name }}
          OBJECTS_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}/objects"

          # Keys are URL-encoded so spaces etc. are safe in the DELETE path.
          KEYS=$(curl -s "$OBJECTS_URL?limit=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '(.result // [])[].key // empty')

          if [ -n "$KEYS" ]; then
            while IFS= read -r KEY; do
              ENCODED_KEY=$(python -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$KEY")
              curl -s -X DELETE "$OBJECTS_URL/$ENCODED_KEY" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /dev/null
            done <<< "$KEYS"
          fi

          curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo "✅ R2 bucket deleted"


      - name: Delete preview worker from Cloudflare
        if: inputs.action == 'teardown'
        working-directory: api-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          WORKER_NAME="preview-${{ steps.slug.outputs.slug }}"
          npx wrangler preview delete --name $WORKER_NAME
          echo "✅ Preview worker deleted"

      - name: Delete Modal environment
        if: inputs.action == 'teardown'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        continue-on-error: true
        run: |
          modal environment delete "${{ steps.slug.outputs.preview_name }}" --yes || true
          echo "✅ Modal environment deleted"