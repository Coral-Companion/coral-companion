name: "✨ Create Preview Environment"
description: Manual gate to create an isolated preview environment for a branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to preview (e.g. feature/COCO-42-universal-answer)"
        type: string
        required: true

jobs:
  create:
    uses: ./.github/workflows/preview-lifecycle.yml
    with:
      action: create
      branch: ${{ github.event.inputs.branch }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_KEY: ${{ secrets.MODAL_KEY }}
      MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}