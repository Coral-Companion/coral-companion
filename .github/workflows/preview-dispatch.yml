name: Create preview environment
description: Manual gate to create an isolated preview environment for a branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to preview (e.g. feature/coastline)"
        type: string
        required: true
      slug:
        description: "URL-safe preview slug (optional, auto-derived from branch)"
        type: string
        required: false

jobs:
  create:
    uses: ./.github/workflows/preview-lifecycle.yml
    with:
      action: create
      branch: ${{ github.event.inputs.branch }}
      slug: ${{ github.event.inputs.slug }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_KEY: ${{ secrets.MODAL_KEY }}
      MODAL_SECRET: ${{ secrets.MODAL_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}